<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>혈월의 사냥꾼 — 방치형 액션 RPG</title>
<meta name="description" content="혈월의 사냥꾼 · 쿼터뷰 방치형 액션 RPG. 자동 사냥, 혈술, 권속, 환생.">
<meta name="theme-color" content="#0a0406">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Noto+Serif+KR:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preload" as="image" href="map1.webp">
<link rel="preload" as="image" href="td-hero.webp">
<style>
:root{--bg:#070304;--panel:#0f0709;--line:rgba(255,70,89,.16);--red:#ff3b52;--red2:#c4142b;--gold:#e8c27a;--txt:#efe4d6;--mut:#9a8a80;--serif:'Noto Serif KR',serif;--cin:'Cinzel',serif}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:Pretendard,-apple-system,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer}
svg{width:100%;height:100%}
#app{display:flex;flex-direction:column;height:100%}
#view{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:#000}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
#view::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 45%,rgba(0,0,0,.55) 100%);z-index:2}
body.bloodmoon #view::after{background:radial-gradient(ellipse at 50% 55%,rgba(120,0,20,.05) 35%,rgba(70,0,10,.6) 100%)}
.hud{position:absolute;z-index:5;pointer-events:none}
.hud *{pointer-events:auto}
/* top-left player */
#tl{left:14px;top:12px;display:flex;align-items:center;gap:10px}
.port{width:54px;height:54px;border-radius:50%;border:2px solid #6b1420;background:#1a0a0d url(td-hero.webp) 50% 8%/190% no-repeat;box-shadow:0 0 0 2px #000,0 0 18px rgba(255,40,60,.35);position:relative}
.port b{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);font:700 .62rem var(--cin);background:#2a0a10;border:1px solid #6b1420;border-radius:6px;padding:1px 6px;white-space:nowrap}
.pinfo{display:flex;flex-direction:column;gap:3px}
.pinfo .nm{font:700 .82rem var(--serif);text-shadow:0 1px 2px #000}
.pinfo .pw{font-size:.72rem;color:var(--gold);background:rgba(0,0,0,.55);padding:2px 8px;border-radius:4px;border-left:2px solid var(--red)}
/* top-center */
#tc{left:50%;top:10px;transform:translateX(-50%);text-align:center;min-width:280px}
#tc .ch{font:700 .78rem var(--serif);letter-spacing:.2em;color:#d9c7b0;text-shadow:0 1px 3px #000;display:flex;align-items:center;justify-content:center;gap:10px}
#tc .ch::before,#tc .ch::after{content:"";width:34px;height:1px;background:linear-gradient(90deg,transparent,#b8935a)}
#tc .ch::after{transform:scaleX(-1)}
#tc .st{font:900 1.65rem var(--cin);letter-spacing:.08em;line-height:1.15;text-shadow:0 0 18px rgba(255,40,60,.5),0 2px 4px #000}
.wave{margin:4px auto 0;width:240px;background:rgba(0,0,0,.6);border:1px solid rgba(184,147,90,.35);border-radius:3px;padding:3px 8px;font-size:.7rem;color:#d9c7b0;position:relative;overflow:hidden}
.wave i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(196,20,43,.55),rgba(255,59,82,.75));width:0;transition:width .3s;z-index:-1}
.wave{isolation:isolate}
/* top-right */
#tr{right:14px;top:12px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.res{display:flex;gap:6px}
.chip{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.62);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:4px 12px 4px 5px;font:700 .86rem var(--cin);min-width:96px;justify-content:space-between}
.chip .ic{width:20px;height:20px;border-radius:50%}
.chip .g{background:radial-gradient(circle at 35% 30%,#fff3c4,#d8a548 50%,#7a5520)}
.chip .s{background:radial-gradient(circle at 35% 30%,#ffb3bd,#e0203a 50%,#5a0410)}
.chip.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.08)}}
.dps{font-size:.7rem;color:var(--mut);background:rgba(0,0,0,.5);padding:3px 10px;border-radius:12px}
.dps b{color:var(--txt);font:700 .8rem var(--cin)}
/* quest */
#quest{right:14px;top:96px;width:230px;background:linear-gradient(90deg,rgba(20,40,20,.0),rgba(10,14,8,.82) 18%);border:1px solid rgba(120,180,90,.35);border-left:3px solid #7fbf5a;padding:8px 12px;cursor:pointer;transition:transform .2s}
#quest:hover{transform:translateX(-3px)}
#quest .qh{font-size:.72rem;color:#a6d48a;font-weight:700}
#quest .qt{font-size:.82rem;font-weight:700;margin:2px 0 6px}
#quest .qb{height:5px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
#quest .qb i{display:block;height:100%;background:linear-gradient(90deg,#4f9a3a,#a6e07a);width:0;transition:width .3s}
#quest .qp{display:flex;justify-content:space-between;font-size:.68rem;color:var(--mut);margin-top:3px}
#quest.done{border-color:#e8c27a;border-left-color:#e8c27a;animation:qglow 1.2s infinite}
#quest.done .qh{color:var(--gold)}
@keyframes qglow{50%{box-shadow:0 0 18px rgba(232,194,122,.45)}}
/* kill streak */
#killc{right:24px;top:52%;font:900 italic 2rem var(--cin);color:#fff;text-shadow:0 0 14px rgba(255,40,60,.9),0 2px 0 #6b0010;opacity:0;transform:skewX(-8deg);transition:opacity .3s;pointer-events:none}
#killc small{font-size:.9rem;color:#ff9aa6;margin-right:6px}
#killc.on{opacity:1}
#killc.pop{animation:kpop .25s}
@keyframes kpop{0%{transform:skewX(-8deg) scale(1.35)}100%{transform:skewX(-8deg) scale(1)}}
/* boss bar */
#boss{left:50%;top:104px;transform:translateX(-50%);width:min(520px,80%);display:none;text-align:center}
#boss.on{display:block}
#boss .bn{font:900 1rem var(--serif);color:#ffd6db;text-shadow:0 0 12px rgba(255,0,40,.8),0 2px 3px #000;letter-spacing:.06em}
#boss .bb{height:14px;margin-top:5px;background:rgba(0,0,0,.75);border:1px solid #7a1020;position:relative;overflow:hidden;clip-path:polygon(1.5% 0,98.5% 0,100% 50%,98.5% 100%,1.5% 100%,0 50%)}
#boss .bb i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(180deg,#ff5468,#a60c22);width:100%;transition:width .12s}
#boss .bb em{position:absolute;left:0;top:0;bottom:0;background:#ffd0a0;width:100%;transition:width .9s .15s;opacity:.55}
#boss .bt{margin-top:5px;height:4px;background:rgba(0,0,0,.6);overflow:hidden;border-radius:2px}
#boss .bt i{display:block;height:100%;background:#e8c27a;width:100%}
#bossBtn{left:50%;top:104px;transform:translateX(-50%);display:none;padding:9px 20px;background:linear-gradient(180deg,#8a1424,#4a0610);border:1px solid #ff5468;border-radius:4px;font:700 .85rem var(--serif);letter-spacing:.1em;box-shadow:0 0 20px rgba(255,40,60,.5);animation:qglow 1.4s infinite}
/* bottom bars */
#bot{left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:0}
.bar{width:220px;height:22px;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.12);position:relative;overflow:hidden;font:700 .7rem var(--cin);display:flex;align-items:center;justify-content:center;text-shadow:0 1px 2px #000}
.bar i{position:absolute;left:0;top:0;bottom:0;z-index:-1;transition:width .25s}
.bar{isolation:isolate}
.bar.hp{border-radius:12px 0 0 12px;margin-right:-8px}
.bar.hp i{background:linear-gradient(180deg,#7be36a,#2f8a24)}
.bar.ex{border-radius:0 12px 12px 0;margin-left:-8px}
.bar.ex i{background:linear-gradient(180deg,#6aa8ff,#2450b8)}
.orb{width:64px;height:64px;border-radius:50%;z-index:2;background:radial-gradient(circle at 50% 40%,#3a0d14,#0c0305 70%);border:2px solid #8a6a3a;box-shadow:0 0 0 3px #000,0 0 20px rgba(255,40,60,.4);display:grid;place-items:center;position:relative;overflow:hidden}
.orb i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(255,59,82,.85),rgba(120,8,22,.9));height:0;transition:height .3s}
.orb span{position:relative;font:900 .78rem var(--cin);text-shadow:0 1px 3px #000;text-align:center;line-height:1.05}
.orb span small{display:block;font-size:.5rem;letter-spacing:.1em;color:#e8c27a}
/* skills */
#sk{right:16px;bottom:14px;display:flex;align-items:flex-end;gap:10px}
#sk .kgrid{display:grid;grid-template-columns:repeat(3,54px);gap:6px}
.kb{width:54px;height:54px;border-radius:10px;border:2px solid rgb(var(--gc));background:#000 center/cover no-repeat;position:relative;overflow:hidden;box-shadow:0 0 0 1px #000,0 0 12px rgba(var(--gc),.45);padding:0;transition:transform .15s}
.kb:active{transform:scale(.9)}
.kb .cd{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.8) calc(var(--p,0)*1turn),transparent 0)}
.kb .tx{position:absolute;inset:0;display:grid;place-items:center;font:900 1rem var(--cin);text-shadow:0 1px 3px #000;color:#fff}
.kb .gb{position:absolute;left:0;right:0;bottom:0;font-size:.5rem;font-weight:800;text-align:center;background:linear-gradient(0deg,rgba(0,0,0,.85),transparent);color:rgb(var(--gc));padding:6px 0 1px;letter-spacing:.05em}
.kb.ready{box-shadow:0 0 0 1px #000,0 0 18px rgba(var(--gc),.9);animation:kbr 1.6s infinite}
@keyframes kbr{50%{box-shadow:0 0 0 1px #000,0 0 26px rgba(var(--gc),1)}}
.kb.lock{filter:grayscale(1) brightness(.35)}
.kb.lock:after{content:'🔒';position:absolute;inset:0;display:grid;place-items:center;font-size:1rem;filter:grayscale(1)}
.kb.g6{border-color:transparent;background-clip:padding-box}
.kb.g6:before{content:'';position:absolute;inset:-2px;border-radius:10px;padding:2px;background:conic-gradient(from var(--ang,0deg),#ff3355,#ffcf6a,#ff3355,#8a1020,#ff3355);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:kspin 3s linear infinite;z-index:2}
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes kspin{to{--ang:360deg}}
.kic{width:44px;height:44px;flex:0 0 auto;border-radius:9px;border:2px solid rgb(var(--gc));background:#000 center/cover;box-shadow:0 0 10px rgba(var(--gc),.4)}
.gtag{display:inline-block;font-size:.62rem;font-weight:800;padding:1px 6px;border-radius:4px;border:1px solid rgb(var(--gc));color:rgb(var(--gc));margin-right:6px;vertical-align:1px}
.skb{width:62px;height:62px;border-radius:50%;border:2px solid #6b4a2a;background:#120709;position:relative;overflow:hidden;box-shadow:0 0 0 2px #000,0 4px 14px rgba(0,0,0,.6);padding:12px;transition:transform .15s}
.skb:active{transform:scale(.92)}
.skb .cd{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.78) calc(var(--p,0)*1turn),transparent 0);border-radius:50%}
.skb .tx{position:absolute;inset:0;display:grid;place-items:center;font:900 1rem var(--cin);text-shadow:0 1px 3px #000}
.skb.ready{border-color:#e8c27a;box-shadow:0 0 0 2px #000,0 0 16px rgba(255,59,82,.6)}
.skb.lock{filter:grayscale(1) brightness(.5)}
.skb .lk{position:absolute;inset:0;display:grid;place-items:center;font-size:.6rem;color:#ccc;text-align:center;line-height:1.2;background:rgba(0,0,0,.4)}
.skb.big{width:78px;height:78px;padding:15px}
.skb .nm{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);font-size:.55rem;white-space:nowrap;background:rgba(0,0,0,.7);padding:0 5px;border-radius:4px}
.auto{height:34px;padding:0 12px;border-radius:17px;border:1px solid #6b4a2a;background:#120709;font:900 .72rem var(--cin);letter-spacing:.06em;color:var(--mut);margin-bottom:14px}
.auto.on{color:#1a0a00;background:linear-gradient(180deg,#ffe1a0,#d8a548);border-color:#ffe1a0;box-shadow:0 0 14px rgba(232,194,122,.6)}
#fx{left:14px;bottom:14px;display:flex;flex-direction:column;gap:6px}
.mini{width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.12);display:grid;place-items:center;font-size:.6rem;font-weight:700;color:var(--mut)}
.mini.on{color:var(--gold);border-color:rgba(232,194,122,.5)}
/* card */
#card{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .8s;background:radial-gradient(ellipse at center,rgba(0,0,0,.55),transparent 70%)}
#card.on{opacity:1}
#card .o{font:700 .9rem var(--serif);letter-spacing:.5em;color:#cfa86a}
#card h2{font:900 clamp(2rem,5vw,3.6rem) var(--serif);letter-spacing:.12em;margin:10px 0;text-shadow:0 0 30px rgba(255,30,50,.6),0 3px 6px #000;background:linear-gradient(180deg,#fff,#d9c7b0);-webkit-background-clip:text;background-clip:text;color:transparent}
#card p{font:500 .95rem var(--serif);color:#c9b8a6;letter-spacing:.2em}
#card .ln{width:min(420px,70%);height:1px;background:linear-gradient(90deg,transparent,#b8935a,transparent);margin:6px 0}
#cutin{position:absolute;inset:0;z-index:9;pointer-events:none;overflow:hidden;display:none}
#cutin.on{display:block}
#cutin .dim{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,.2),rgba(0,0,0,.75));animation:cfade 1.5s forwards}
#cutin .band{position:absolute;left:-10%;right:-10%;top:28%;height:38%;background:linear-gradient(90deg,transparent,rgba(var(--c),.9) 18%,rgba(12,0,4,.94) 45%,rgba(12,0,4,.94) 60%,rgba(var(--c),.9) 85%,transparent);border-top:2px solid rgba(var(--c),1);border-bottom:2px solid rgba(var(--c),1);transform:skewY(-6deg) scaleY(0);animation:band 1.5s cubic-bezier(.2,.8,.2,1) forwards;box-shadow:0 0 60px rgba(var(--c),.7)}
#cutin .por{position:absolute;bottom:14%;left:-45%;height:82%;animation:por 1.5s cubic-bezier(.2,.8,.2,1) forwards;filter:drop-shadow(0 0 30px rgba(var(--c),.9))}
#cutin .nm{position:absolute;right:7%;top:39%;text-align:right;opacity:0;animation:nm 1.5s forwards}
#cutin .nm small{display:block;font:700 .9rem var(--cin);letter-spacing:.5em;color:rgba(var(--c),1);text-shadow:0 0 10px #000}
#cutin .nm b{display:block;font:900 clamp(2rem,5vw,4rem) var(--serif);color:#fff;letter-spacing:.14em;text-shadow:0 0 24px rgba(var(--c),1),0 4px 8px #000}
#cutin .ln2{position:absolute;left:0;right:0;top:50%;height:3px;background:linear-gradient(90deg,transparent,#fff,transparent);transform:skewY(-6deg) scaleX(0);animation:ln2 1.5s forwards}
@keyframes band{0%{transform:skewY(-6deg) scaleY(0)}14%{transform:skewY(-6deg) scaleY(1)}82%{opacity:1;transform:skewY(-6deg) scaleY(1)}100%{opacity:0;transform:skewY(-6deg) scaleY(.6)}}
@keyframes por{0%{left:-45%}16%{left:4%}78%{left:10%;opacity:1}100%{left:34%;opacity:0}}
@keyframes nm{0%{opacity:0;transform:translateX(80px)}20%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateX(-50px)}}
@keyframes ln2{0%{transform:skewY(-6deg) scaleX(0)}20%{transform:skewY(-6deg) scaleX(1);opacity:1}100%{transform:skewY(-6deg) scaleX(1);opacity:0}}
@keyframes cfade{0%{opacity:0}12%{opacity:1}80%{opacity:1}100%{opacity:0}}
#skname{position:absolute;left:50%;bottom:112px;z-index:7;font:900 1.5rem var(--serif);letter-spacing:.24em;color:#fff;text-shadow:0 0 18px rgba(var(--c),1),0 0 40px rgba(var(--c),.8),0 2px 4px #000;opacity:0;pointer-events:none;white-space:nowrap;transform:translateX(-50%)}
#skname small{display:block;text-align:center;font:700 .62rem var(--cin);letter-spacing:.5em;color:rgba(var(--c),1)}
#skname.on{animation:skn 1.2s forwards}
@keyframes skn{0%{opacity:0;transform:translateX(-50%) scale(1.8)}14%{opacity:1;transform:translateX(-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-16px)}}
#fade{position:absolute;inset:0;background:#000;z-index:9;opacity:0;pointer-events:none;transition:opacity .6s}
#fade.on{opacity:1}
/* panel */
#panel{flex:0 0 auto;height:min(300px,40vh);background:linear-gradient(180deg,#120709,#0a0405);border-top:1px solid #4a0d17;display:flex;flex-direction:column;position:relative;z-index:6}
#panel::before{content:"";position:absolute;left:0;right:0;top:-1px;height:1px;background:linear-gradient(90deg,transparent,#ff3b52,transparent)}
#tabs{display:flex;border-bottom:1px solid var(--line)}
#tabs button{flex:1;background:none;border:0;padding:11px 0;font:700 .9rem var(--serif);color:var(--mut);letter-spacing:.2em;position:relative}
#tabs button.on{color:var(--txt)}
#tabs button.on::after{content:"";position:absolute;left:30%;right:30%;bottom:-1px;height:2px;background:var(--red);box-shadow:0 0 10px var(--red)}
#list{flex:1;overflow:auto;padding:12px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px;align-content:start}
#list::-webkit-scrollbar{width:6px}#list::-webkit-scrollbar-thumb{background:#3a1018;border-radius:3px}
.mult{grid-column:1/-1;display:flex;gap:6px}
.mult button{padding:4px 12px;border-radius:4px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);font-size:.75rem;font-weight:700;color:var(--mut)}
.mult button.on{border-color:var(--gold);color:var(--gold);background:rgba(232,194,122,.08)}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01));border:1px solid rgba(255,255,255,.07);border-radius:8px}
.ri{width:40px;height:40px;flex:0 0 auto;border-radius:8px;background:radial-gradient(circle at 50% 40%,#3a0d14,#150608);border:1px solid #5a1420;padding:8px}
.rt{flex:1;min-width:0}
.rt b{display:block;font:700 .9rem var(--serif)}
.rt b em{font:700 .72rem var(--cin);color:var(--gold);font-style:normal;margin-left:6px}
.rt small{display:block;font-size:.74rem;color:var(--mut);margin-top:2px;line-height:1.35}
.buy{min-width:92px;padding:7px 10px;border-radius:6px;border:1px solid #8a6a3a;background:linear-gradient(180deg,#3a1a10,#1e0b08);font:700 .85rem var(--cin);color:var(--gold);line-height:1.15;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.buy small{display:block;font:500 .62rem Pretendard,sans-serif;color:var(--mut)}
.buy:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.6)}
.buy:not(:disabled):hover{border-color:#e8c27a;box-shadow:0 0 12px rgba(232,194,122,.35)}
.reb{grid-column:1/-1;display:flex;gap:14px;align-items:center;padding:14px;border:1px solid #5a1420;border-radius:8px;background:radial-gradient(ellipse at 0 50%,rgba(196,20,43,.2),transparent 60%)}
.reb h3{font:900 1rem var(--serif);color:#ff8a98}
.reb p{font-size:.78rem;color:var(--mut);margin-top:4px;line-height:1.5}
/* title */
#title{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;cursor:pointer;transition:opacity 1s}
#title.off{opacity:0;pointer-events:none}
#title .tbg{position:absolute;inset:-4%;background:url(map1.webp) center/cover;filter:brightness(.42) saturate(.9) blur(1px);animation:tz 30s linear infinite alternate}
@keyframes tz{to{transform:scale(1.12) rotate(1deg)}}
#title .th{position:absolute;bottom:0;left:50%;height:78%;transform:translateX(-50%);filter:drop-shadow(0 0 30px rgba(255,0,30,.45))}
#title::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 30%,#000 90%)}
#title .tt{position:relative;z-index:2;text-align:center;margin-bottom:22vh}
#title .tt .o{font:700 .85rem var(--cin);letter-spacing:.6em;color:#cfa86a}
#title .tt h1{font:900 clamp(2.6rem,8vw,5.6rem) var(--serif);letter-spacing:.14em;margin:8px 0;background:linear-gradient(180deg,#fff 20%,#ff6b7a 60%,#8a0a1c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 24px rgba(255,20,40,.55)) drop-shadow(0 4px 4px #000)}
#title .tt p{font:500 .9rem var(--serif);color:#c9b8a6;letter-spacing:.3em}

const SFX = (() => {
  let ac = null, master = null, comp = null, noise = null, on = (() => { try { return localStorage.getItem('bloodmoon-sound') !== 'off'; } catch { return true; } })();
  const last = {};
  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    ac = new C(); comp = ac.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 5; comp.attack.value = .003; comp.release.value = .2;
    master = ac.createGain(); master.gain.value = on ? .55 : 0; master.connect(comp); comp.connect(ac.destination);
    noise = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate); const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const ok = (k, gap) => { if (!ac || !on) return false; const t = ac.currentTime; if (last[k] && t - last[k] < gap) return false; last[k] = t; return true; };
  const env = (g, t, a, peak, dec) => { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + dec); };
